<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FoxByte todos</title>
<style>
  :root {
    --ink: #1c1915;
    --muted: #6b645c;
    --line: #e4ddd4;
    --paper: #f7f3ec;
    --card: #fffdf9;
    --accent: #0f6e6b;
    --accent-ink: #083f3d;
    --flash: #f3e2a4;
    --bad: #9a3412;
    --ok: #166534;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .badge {
    font: 700 13px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .status {
    margin-left: auto;
    font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    background: #eeeae3;
    color: var(--muted);
  }
  .status.live { background: #dcfce7; color: var(--ok); }
  .status.paused { background: #ffedd5; color: var(--bad); }
  main { padding: 16px 18px 28px; max-width: 720px; }
  form.add, .row, .panel, .log {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  form.add { display: flex; gap: 8px; padding: 10px; }
  input[type="text"] {
    flex: 1;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: white;
  }
  button, .linkish {
    font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
    border: 0;
    border-radius: 8px;
    padding: 9px 12px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent-ink); border: 1px solid var(--line); }
  button.warn { background: transparent; color: var(--bad); border: 1px solid #f1d2c6; }
  button:disabled { opacity: 0.5; cursor: default; }
  ul { list-style: none; margin: 14px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
  }
  .row.flash { background: var(--flash); }
  .row.done .title { color: var(--muted); text-decoration: line-through; }
  .title { font-size: 16px; }
  .meta { color: var(--muted); font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; }
  .ops { display: flex; gap: 6px; }
  .panel, .log { padding: 12px 14px; margin-top: 12px; }
  .panel h2, .log h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .log ol { margin: 0; padding-left: 18px; }
  .log li { margin: 2px 0; }
  .nums { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="badge" id="who">Window</div>
  <div>
    <h1>Todos</h1>
    <div class="sub" id="branch">branch</div>
  </div>
  <div class="status" id="status">connecting</div>
</header>
<main>
  <form class="add" id="add">
    <input id="title" type="text" name="title" placeholder="What needs doing?" autocomplete="off" required />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <section class="panel">
    <h2>Feed</h2>
    <div class="controls">
      <button type="button" class="ghost" id="pause">Disconnect</button>
      <button type="button" class="ghost" id="resume" disabled>Resume from saved position</button>
      <button type="button" id="measure">Measure 50 adds</button>
    </div>
    <p class="meta" id="pos">No position saved yet. A position is the last commit the feed delivered, and it is the only safe place to resume.</p>
    <div class="nums" id="stats"></div>
  </section>
  <section class="log">
    <h2>Live events</h2>
    <ol id="events"></ol>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
