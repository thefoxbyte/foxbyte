#
# How GitHub groups the auto-generated release notes (the `--generate-notes`
# that .github/workflows/release.yml passes when it creates a release).
#
# Without this, the notes are one flat list in merge order, so a dependabot
# bump sits between two features and nothing says which changes a reader should
# care about. The categories below are matched against each pull request's
# labels, in order, and the first match wins.
#
# Note how this repository actually works: human pull requests carry no labels,
# and only dependabot's are labelled (dependencies, go, github_actions,
# javascript). So the catch-all is where almost everything lands today, and
# that is deliberate rather than a gap — it keeps dependency bumps out of the
# way without pretending the rest is already sorted. Labelling a pull request
# `enhancement`, `bug` or `documentation` before it merges is all it takes to
# move it into a section of its own.
changelog:
  exclude:
    # Nothing is excluded by author, deliberately. A dependency bump is a real
    # change to what ships, and notes that quietly omit one are a worse record
    # than notes that are a little longer. They are sorted to the bottom
    # instead.
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    # The catch-all, which GitHub matches last whatever its position here. Its
    # own `exclude` is what keeps dependency bumps out of it — the pattern
    # GitHub's own documentation uses, and the only way to have both a
    # catch-all and a section after it.
    - title: Changes
      labels:
        - '*'
      exclude:
        labels:
          - dependencies
    - title: Dependencies
      labels:
        - dependencies
