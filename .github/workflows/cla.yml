# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The Contributor License Agreement, asked for and recorded automatically.
#
# A contributor opens a pull request, a bot asks them to sign CLA.md, they reply
# once with the sentence below, and the signature is committed to a branch of
# this repository. They are never asked again, on any later pull request. Nobody
# has to remember to ask, and nothing can be merged unsigned by accident — which
# is exactly what happened with the first outside contribution (#37).
#
# OFF BY DEFAULT. CLA.md is still a draft and says so at the top; turning this on
# now would collect signatures against a document no lawyer has read. To enable
# it once the review is done:
#
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   Name: CLA_ENABLED   Value: true
#
# then make "CLA" a required status check on main, so an unsigned pull request
# cannot be merged rather than merely being asked twice.
#
# Why pull_request_target rather than pull_request: a pull request from a fork
# gets a read-only token, which cannot comment or commit, so the bot would be
# silent exactly where it is needed. pull_request_target runs with this
# repository's token instead. That is only safe because this workflow never
# checks out or runs the pull request's code — it reads the event and writes
# comments. Do not add a checkout step to it.
name: CLA

on:
  # The pull request itself, and the comment the contributor signs with.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write      # the signatures file is committed to this repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Draft until the review lands; see the note at the top of this file.
    if: ${{ vars.CLA_ENABLED == 'true' }}
    steps:
      - name: Check or record the signature
        # A pull request, a comment signing it, or `recheck`.
        #
        # `recheck` matters more than it looks: the action's own comment tells
        # people to write it when something has gone wrong, and a condition that
        # does not match it leaves the bot advertising a command that silently
        # does nothing. That is how it stays stuck — the first signature attempt
        # here failed because the signatures branch did not exist yet, and
        # nothing anyone typed afterwards would have retried it.
        #
        # `contains` rather than an exact match, because a signature arrives with
        # whatever a person typed around it. The action does the real matching;
        # this only decides whether to start it. One cost worth knowing: a comment
        # that quotes the sentence to explain it — like asking someone to sign —
        # starts a run too. Harmless, and the alternative is missing real
        # signatures over a stray full stop.
        #
        # `recheck` is matched exactly, as the action's own documentation has it:
        # it is a command rather than prose, and `contains` would fire on any
        # comment that happened to use the word. Expressions here are limited to
        # the functions GitHub provides — there is no trim(), and an invented one
        # is a runtime error rather than a parse error, so it would only show up
        # when someone needed it.
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
            (contains(github.event.comment.body, 'I hereby sign it') ||
             github.event.comment.body == 'recheck'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on a branch of their own. They are the evidence that
          # a licence was granted, and sections 19(1) and 30 of the Copyright
          # Act, 1957 want a licence in writing and signed — so they are kept in
          # this repository's history, where the commit and its timestamp are
          # ours, rather than on a third party's server.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json

          # The agreement being signed. A permanent link, so the comment a
          # contributor reads points at the document they actually agreed to.
          # Built from the event rather than written out, so it survives the
          # rename this project has already been through twice.
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md

          # Word for word the sentence in CLA.md's "How to sign" section. A test
          # holds the two together (TestContributorGuidePromisesOnlyWhatExists):
          # if they drift, a contributor reads one sentence and the bot waits for
          # another, and nothing says why the signature is not being recognised.
          custom-pr-sign-comment: I have read the FoxByte CLA and I hereby sign it.

          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged we need you to sign the Contributor License Agreement — once, ever, not once per pull request.

            **Please read it first:** it is short, and it says plainly that FoxByte has a paid edition and that your contribution may end up there. You keep your copyright and your moral rights either way. If that is not something you want, say so and we will close this with no hard feelings — we would rather lose a contribution than take one on terms its author did not want.

            To sign, add a **new comment** on this pull request containing only this line — please do not use **Quote reply**, because the quoted text becomes part of your comment and the whole comment has to be the line:

          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you.

          # Maintainers and bots. A bot cannot agree to a contract, and asking
          # Dependabot to sign one would block every dependency bump.
          allowlist: SauravYadav12,SauravCodemotion,dependabot[bot],*[bot]

          # Locked after merge so a signature comment cannot be deleted later.
          # The record is the evidence; it should outlive second thoughts.
          lock-pullrequest-aftermerge: true

      # Say why it failed, which the action cannot.
      #
      # Its message is the same whether nobody signed or somebody signed in a
      # way that did not match — "Committers of Pull Request number N have to
      # sign the CLA" — and the second is the common case. GitHub's Quote reply
      # copies the bot's whole message into the comment, and the action compares
      # the whole body, so a quoted signature carries the sentence without being
      # it. The workflow above is deliberately tolerant and starts a run for any
      # comment CONTAINING the sentence; the action is strict. That gap is the
      # trap, and before this step a contributor saw a red cross, tried
      # `recheck`, saw the same red cross, and had nothing to go on.
      #
      # Only for a comment that carries the sentence but is not the sentence.
      # Someone who has not signed at all gets the bot's own message, which is
      # already the right one for them.
      - name: Say why, when a signature was attempted but not matched
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PHRASE: I have read the FoxByte CLA and I hereby sign it.
          MARK: "<!-- cla-quote-hint -->"
        run: |
          set -euo pipefail
          [ -n "${PR:-}" ] || exit 0
          comments="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate)"

          # Said once, not once per `recheck`.
          if jq -e --arg m "$MARK" 'any(.[]; .body | contains($m))' >/dev/null <<<"$comments"; then
            echo "already explained on #$PR"; exit 0
          fi

          # Only the people whose signature is actually required — the pull
          # request's committers, which is who the action's error names. A
          # maintainer quoting the sentence to ASK someone to sign carries it
          # too, and the first version of this step mistook exactly that for a
          # failed signature on an already-signed pull request.
          committers="$(gh api "repos/$GH_REPO/pulls/$PR/commits" --paginate \
            --jq '[.[] | .author.login // empty, .committer.login // empty] | unique')"

          # A committer's comment that carries the sentence without being it.
          if ! jq -e --arg p "$PHRASE" --argjson who "$committers" '
                any(.[];
                  (.user.login as $u | $who | index($u))
                  and (.body | contains($p))
                  and ((.body | gsub("^[[:space:]]+|[[:space:]]+$"; "")) != $p))' >/dev/null <<<"$comments"; then
            echo "no near-miss signature from a committer on #$PR; the bot's own message covers it"; exit 0
          fi

          cat > hint.md <<EOF
          $MARK
          It looks like the signature above was posted with **Quote reply**, so the comment carries this bot's message as well as the line. The whole comment has to be the line, which is why the check is still red — nothing is wrong with your agreement to it.

          Please add a **new comment** containing only:

          \`\`\`
          $PHRASE
          \`\`\`

          Then comment \`recheck\`, or just wait — a new signature comment starts the check by itself.
          EOF
          gh pr comment "$PR" --body-file hint.md
          echo "explained the near miss on #$PR"
