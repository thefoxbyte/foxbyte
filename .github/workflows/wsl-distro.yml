# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the prebuilt Windows distro image: one asset, every WSL kernel.
#
# This used to also build ZFS kernel modules, one job per kernel, because ZFS is
# out-of-tree and vermagic ties a module to one exact kernel. That is why a
# release could only ever cover the kernels someone had thought to list, and why
# users on any other kernel hit "no ZFS module bundle published for this WSL
# kernel". Windows now stores branches on btrfs, which is in the stock WSL
# kernel, so there is nothing kernel-specific left to build and the matrix is
# gone. wsl-zfs.yml still builds ZFS on demand if it is ever needed again.
name: wsl-distro

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  distro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.26.11'
          check-latest: true  # newest 1.26.x, not the image's cached one
      # `make release-linux` runs `npm ci`, which re-downloads the whole
      # dependency tree on a cold runner. Cache it on the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22: jsdom 30 (the component tests' DOM) declares
          # engines ^22.22.2, and on 20 it fails at import with
          # `webidl.util.markAsUncloneable is not a function` before a
          # single test runs. GitHub had already begun warning that
          # Node 20 is deprecated on their runners, so this was owed
          # anyway rather than something the tests forced.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Parallel gzip. build.sh compresses ~1.7 GB, and gzip is single-threaded;
      # pigz produces an identical-format, same-size archive using every core.
      - name: Install pigz
        run: sudo apt-get install -y --no-install-recommends pigz

      # Only the Linux binary: it is the one baked into the image, and
      # release.yml publishes the full cross-compiled set separately.
      - name: Build the engine binary
        run: make release-linux VERSION="${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build the distro image
        run: make wsl-distro

      # The release may not exist yet if this job gets here before release.yml.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --generate-notes --title "$TAG"

      # This job's checksums are signed with the release key (audit v2 G22). A
      # missing secret fails the job here, rather than publishing an image with
      # no signature. (cmd/releasesign also refuses a key fox would not accept.)
      - name: Build the release signer
        env:
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$FOX_RELEASE_SIGNING_KEY" || { echo "::error::the FOX_RELEASE_SIGNING_KEY secret is not set (see cmd/releasesign)"; exit 1; }
          go build -o "$RUNNER_TEMP/releasesign" ./cmd/releasesign

      # A signed file of this job's own, because this workflow can run at any
      # time for an existing tag and release.yml owns SHA256SUMS. Only the hash
      # of the image built above is signed; nothing is read back from the
      # release. install.ps1 looks the image up here, then in SHA256SUMS for
      # releases made before this file existed.
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SIGN: ${{ runner.temp }}/releasesign
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          bash ../scripts/release-checksums.sh "$TAG" SHA256SUMS.distro foxbyte-distro.tar.zst

      - name: Attach the distro image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/foxbyte-distro.tar.zst --clobber
