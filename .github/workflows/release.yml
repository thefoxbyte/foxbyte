# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Cuts the GitHub release and attaches the binaries install.sh / install.ps1
# download. The ZFS bundle is attached separately by wsl-zfs.yml, which runs on
# the same tag — this job creates the release first so that upload has somewhere
# to go.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build release artifacts
        run: make release VERSION="${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # install.ps1 fetches every one of these by name; a release missing any of
      # them installs a bb.exe that cannot then set itself up.
      - name: Assert the full asset set is present
        run: |
          set -eux
          test -f dist/fox-windows-amd64.exe
          test -f dist/fox-linux-amd64
          test -f dist/fox-linux-arm64
          test -f dist/fox-darwin-amd64
          test -f dist/fox-darwin-arm64
          # the independent Blackbox verifier (Blackbox 2.0)
          test -f dist/fox-verify-linux-amd64
          test -f dist/fox-verify-linux-arm64
          test -f dist/fox-verify-darwin-amd64
          test -f dist/fox-verify-darwin-arm64
          test -f dist/fox-verify-windows-amd64.exe
          test -f dist/foxbyte-docker-context.tar.gz

      # Created as a prerelease and left as a draft-free placeholder so
      # wsl-zfs.yml can upload the ZFS bundle into it. Promote it by hand once
      # the install has been smoke-tested on a clean Windows machine.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --generate-notes --title "$TAG"

      # Published so the installer can verify what it downloads. Without it the
      # only integrity guarantee is TLS, and these assets are executed as root
      # inside the user's distro.
      #
      # SHA256SUMS is shared with wsl-distro.yml, which runs on the same tag and
      # can finish before or after this job. The script merges this job's entries
      # into the published file by exact name, keeps the other job's, and checks
      # again after uploading — so neither job can drop the other's checksums
      # (v0.8.1 lost the distro image's entry that way).
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          bash ../scripts/release-checksums.sh "$TAG" fox-* foxbyte-docker-context.tar.gz

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/fox-* dist/foxbyte-docker-context.tar.gz --clobber

      # `fox update` only offers a release that has every file it needs for the
      # user's platform, listed in SHA256SUMS. Fail here rather than publish a
      # release nobody can update to.
      - name: Check the files fox update needs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/check-release-assets.sh "$TAG"

  # Publish the Postgres+wal-g image so `fox setup` pulls it (~30-60s) instead of
  # building it locally on every install (~2-5min, and dependent on the wal-g
  # release being reachable). ensureImage() falls back to building if the pull
  # fails, so this is an optimization, not a hard dependency.
  #
  # NOTE: the first push creates the ghcr.io/thefoxbyte/postgres-walg package as
  # PRIVATE. Make it public once (org → Packages → package → visibility) so
  # `docker pull` works without auth.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thefoxbyte/postgres-walg:16
            ghcr.io/thefoxbyte/postgres-walg:${{ inputs.tag || github.ref_name }}
