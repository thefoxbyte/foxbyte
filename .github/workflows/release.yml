# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Cuts the GitHub release and attaches the binaries install.sh / install.ps1
# download. The ZFS bundle is attached separately by wsl-zfs.yml, which runs on
# the same tag — this job creates the release first so that upload has somewhere
# to go.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.1.0)'
        required: true
      allow_red_nightly:
        description: 'Release even though the nightly suites are red or stale (say why in the release notes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A tag must not ship past a red suite (audit v2 G24, the half the nightly was
  # built for). The integration suites are the only tests of branching, wake on
  # connect, point-in-time restore, HA failover and the Blackbox's triggers, and
  # they run nightly rather than per push because they need a disposable machine.
  # Until now nothing connected the two: a tag built and published whatever the
  # nightly had found.
  #
  # A tag push is always gated. A manual run can set allow_red_nightly, which is
  # printed loudly in the log — there is no way to set it from a tag.
  nightly-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the ancestry check below needs history
          ref: ${{ inputs.tag || github.ref }}
      - name: The newest nightly must be green, and recent
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RED: ${{ inputs.allow_red_nightly }}
          MAX_AGE_HOURS: '48'
        run: |
          set -euo pipefail
          # branch=main, and that matters: without it the newest *completed* run on
          # any branch satisfies the gate. A green nightly on a side branch once
          # cleared a release of main it had never built -- the ancestry warning
          # below was the only hint, and a warning does not stop a release.
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // empty')"
          if [ -z "$run_json" ]; then
            echo "::error::no completed nightly run on main to check. Run the nightly workflow against main (Actions -> nightly -> Run workflow -> Branch: main), then tag."
            [ "$ALLOW_RED" = "true" ] || exit 1
          fi
          conclusion="$(jq -r '.conclusion // "none"' <<<"${run_json:-\{\}}")"
          run_id="$(jq -r '.id // ""' <<<"${run_json:-\{\}}")"
          created="$(jq -r '.created_at // ""' <<<"${run_json:-\{\}}")"
          url="$(jq -r '.html_url // ""' <<<"${run_json:-\{\}}")"
          sha="$(jq -r '.head_sha // ""' <<<"${run_json:-\{\}}")"
          echo "newest nightly: $conclusion at $created"
          echo "  $url"
          age_hours=999
          if [ -n "$created" ]; then
            age_hours=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
            echo "  that run is ${age_hours}h old"
          fi
          fail=0
          [ "$conclusion" = "success" ] || { echo "::error::the newest nightly concluded '$conclusion'. Fix it, or re-run it, before tagging a release."; fail=1; }
          [ "$age_hours" -le "$MAX_AGE_HOURS" ] || { echo "::error::the newest nightly is ${age_hours}h old (limit ${MAX_AGE_HOURS}h), so it says little about this tag. Re-run it."; fail=1; }
          # Green is not enough: the nightly takes a `suite` input, and a run of one
          # suite skips the other five and still concludes 'success'. Such a run
          # would satisfy every check above while having tested almost nothing,
          # which is worse than a red gate because it looks like evidence. A full
          # nightly skips no job, so any skipped job means this run cannot speak for
          # the release.
          if [ -n "$run_id" ]; then
            skipped="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "skipped") | .name] | join(", ")' 2>/dev/null || echo "")"
            if [ -n "$skipped" ]; then
              echo "::error::that nightly ran only part of the matrix (skipped: $skipped). Run the whole nightly — no 'suite' input — before tagging."
              fail=1
            else
              echo "  every suite in that run reported."
            fi
          fi
          # Whether the code being released is actually what the nightly ran. Not a
          # failure: a release cut soon after a merge is legitimately ahead of last
          # night's run, and saying so is more useful than blocking it.
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$(git rev-parse HEAD)" "$sha"; then
              echo "this tag's commit is covered by that nightly run."
            else
              echo "::warning::this tag has commits the newest nightly never ran ($(git rev-parse --short HEAD) is not an ancestor of ${sha:0:7})."
            fi
          fi
          if [ "$fail" = 1 ]; then
            if [ "$ALLOW_RED" = "true" ]; then
              echo "::warning::releasing past the nightly gate because allow_red_nightly was set."
            else
              exit 1
            fi
          fi

  release:
    needs: nightly-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # build attestations (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      # A release is the one thing that cannot be taken back, so it must not go out
      # with the object store pinned by tag alone: a tag in our own registry can
      # still be moved, and then an install would run bytes nobody tested. The
      # digests come from .github/workflows/mirror-images.yml, which prints them.
      - name: The object-store images must be pinned by digest
        run: |
          set -euo pipefail
          missing=0
          for c in MinioDigest MCDigest; do
            v="$(sed -n "s/^[[:space:]]*$c[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" internal/branch/images.go | head -1)"
            if [ -z "$v" ]; then
              echo "::error::$c is empty in internal/branch/images.go — run the mirror-images workflow for this version and pin what it prints"
              missing=1
            else
              echo "$c = $v"
            fi
          done
          exit "$missing"

      # And that what is pinned runs on both architectures. The mirror takes the
      # images out of the Windows distro image, which is built on an amd64 runner,
      # and a save/load/push keeps one platform — so a mirrored image is amd64 only
      # unless it was deliberately combined (scripts/mirror-images-local.sh). Pushed
      # single-arch it works everywhere except Apple Silicon, where the engine dies
      # with "exec format error" on the first start.
      - name: The object-store images must run on amd64 and arm64
        run: |
          set -euo pipefail
          fail=0
          for c in Minio MC; do
            tag="$(sed -n "s/^[[:space:]]*${c}Tag[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" internal/branch/images.go | head -1)"
            digest="$(sed -n "s/^[[:space:]]*${c}Digest[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" internal/branch/images.go | head -1)"
            repo="${tag%%:*}"; repo="${repo#ghcr.io/}"
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)"
            platforms="$(curl -fsS -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${digest}" \
              | jq -r '[(.manifests // [])[] | .platform.os + "/" + .platform.architecture] | join(" ")')"
            if [ -z "$platforms" ]; then
              # No manifest list at all: one platform, whichever it was built on.
              echo "$tag@$digest: a single-platform image"
              echo "::error::$tag is not a multi-architecture image, so it runs on one architecture only — rebuild the mirror with scripts/mirror-images-local.sh"
              fail=1
              continue
            fi
            echo "$tag@$digest: $platforms"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::$tag has no $want build — rebuild the mirror with scripts/mirror-images-local.sh"; fail=1 ;;
              esac
            done
          done
          exit "$fail"

      - name: Build release artifacts
        run: make release VERSION="${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # install.ps1 fetches every one of these by name; a release missing any of
      # them installs a fox.exe that cannot then set itself up.
      - name: Assert the full asset set is present
        run: |
          set -eux
          test -f dist/fox-windows-amd64.exe
          test -f dist/fox-linux-amd64
          test -f dist/fox-linux-arm64
          test -f dist/fox-darwin-amd64
          test -f dist/fox-darwin-arm64
          # The Enterprise edition, built from the same tree with -tags enterprise.
          # An Enterprise install updates itself from these, so a release missing
          # one of them would quietly hand that platform the Standard binary and
          # look to the user like their licence had stopped working.
          test -f dist/fox-enterprise-windows-amd64.exe
          test -f dist/fox-enterprise-linux-amd64
          test -f dist/fox-enterprise-linux-arm64
          test -f dist/fox-enterprise-darwin-amd64
          test -f dist/fox-enterprise-darwin-arm64
          # the independent Blackbox verifier (Blackbox 2.0)
          test -f dist/fox-verify-linux-amd64
          test -f dist/fox-verify-linux-arm64
          test -f dist/fox-verify-darwin-amd64
          test -f dist/fox-verify-darwin-arm64
          test -f dist/fox-verify-windows-amd64.exe
          test -f dist/foxbyte-docker-context.tar.gz

      # A software bill of materials for the source tree: every Go module and
      # npm package a release is built from (audit v2 G22).
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/foxbyte-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # GitHub build attestations: signed (Sigstore, keyless) statements that
      # each file was built by this workflow from this commit. Check one with
      #   gh attestation verify fox-linux-amd64 --repo thefoxbyte/foxbyte
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fox-*
            dist/foxbyte-docker-context.tar.gz
            dist/foxbyte-sbom.spdx.json

      # SHA256SUMS is signed with the release key (audit v2 G22): fox update and
      # install.sh refuse a release whose signature does not check. A missing
      # secret fails the release here, rather than publishing one nobody can
      # install. (cmd/releasesign also refuses a key fox would not accept.)
      - name: Build the release signer
        env:
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$FOX_RELEASE_SIGNING_KEY" || { echo "::error::the FOX_RELEASE_SIGNING_KEY secret is not set (see cmd/releasesign)"; exit 1; }
          go build -o "$RUNNER_TEMP/releasesign" ./cmd/releasesign

      # Created as a prerelease and left as a draft-free placeholder so
      # wsl-zfs.yml can upload the ZFS bundle into it. The release-verify job
      # below promotes it once an older install has been shown to update to it.
      #
      # It is forced to prerelease even when the release already exists, and
      # that `gh release edit` is the whole point. Creating the release by hand
      # — `gh release create`, or the web UI — makes the tag and the release in
      # one go, so the `gh release view` below succeeds and the --prerelease on
      # the create never ran. Both v1.0 and v1.0.1 were published that way and
      # neither was ever a prerelease: the guard this comment describes had
      # never once applied. A prerelease matters because `fox update` does not
      # offer one, so an unverified release cannot reach anybody.
      - name: Create the release if it does not exist, and hold it as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --generate-notes --title "$TAG"
          gh release edit "$TAG" --prerelease
          echo "$TAG is held as a prerelease; release-verify promotes it."

      # Published so the installer can verify what it downloads. Without it the
      # only integrity guarantee is TLS, and these assets are executed as root
      # inside the user's distro.
      #
      # SHA256SUMS is shared with wsl-distro.yml, which runs on the same tag and
      # can finish before or after this job. The script merges this job's entries
      # into the published file by exact name, keeps the other job's, and checks
      # again after uploading — so neither job can drop the other's checksums
      # (v0.8.1 lost the distro image's entry that way).
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SIGN: ${{ runner.temp }}/releasesign
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          bash ../scripts/release-checksums.sh "$TAG" fox-* foxbyte-docker-context.tar.gz foxbyte-sbom.spdx.json

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/fox-* dist/foxbyte-docker-context.tar.gz dist/foxbyte-sbom.spdx.json --clobber

      # `fox update` only offers a release that has every file it needs for the
      # user's platform, listed in SHA256SUMS. Fail here rather than publish a
      # release nobody can update to.
      - name: Check the files fox update needs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/check-release-assets.sh "$TAG"

  # Publish the Postgres+wal-g image so `fox setup` pulls it (~30-60s) instead of
  # building it locally on every install (~2-5min, and dependent on the wal-g
  # release being reachable). ensureImage() falls back to building if the pull
  # fails, so this is an optimization, not a hard dependency.
  #
  # NOTE: the first push creates the ghcr.io/thefoxbyte/postgres-walg package as
  # PRIVATE. Make it public once (org → Packages → package → visibility) so
  # `docker pull` works without auth.
  #
  # One image per supported PostgreSQL major (internal/branch/images.go's
  # SupportedPGMajors; a test keeps this matrix in step with it). An install keeps
  # running the major its data was created with, so the older one must stay
  # pullable after a fresh install moves on.
  # Gated too: the image is part of what a release hands people, and a red suite
  # is as good a reason not to publish it as not to publish the binaries.
  # Does an existing install actually accept this release?
  #
  # Everything in the release job checks that files exist, that SHA256SUMS lists
  # them and that the signature is ours. None of it runs the published binary.
  # v1.0 passed every one of those checks and was then refused by every install
  # that tried to take it, because `fox update` validates a staged engine by
  # parsing its `version` output and the parser doing the work belongs to the
  # OLD binary. That is not a gap a presence check can close.
  #
  # So this installs from the published assets, the way a person does, and then
  # updates to this release from the one before it. `--version` is what lets it
  # do that while the release is still a prerelease: Candidates() admits a
  # pinned prerelease (internal/update/select.go), while an ordinary
  # `fox update` never offers one. So nobody can be offered this release until
  # the job below promotes it, and if the job fails it stays unreachable.
  #
  # It deliberately stops at the staged-engine check rather than completing the
  # update, which would need a pool and containers. What happens after that
  # check is covered by the nightly's `update` suite against a real stack; what
  # is covered only here is the published artifact.
  release-verify:
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # promotes the release on success
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A clean machine taking this release for the first time. Catches a
      # corrupt or wrong-architecture asset, and a binary that does not report
      # the version it was published as — which is the one `fox update` compares
      # against, so a mismatch stops every update to it.
      - name: A fresh install of this release
        run: |
          set -euo pipefail
          FOX_VERSION="$TAG" sh deploy/install.sh
          line="$(fox version)"
          echo "fox version says: $line"
          got="$(printf '%s' "$line" | awk '{print $2}')"
          [ "$got" = "${TAG#v}" ] || {
            echo "::error::a fresh install of $TAG reports '$got'. fox update compares this to the release tag, so every update to $TAG would be refused."
            exit 1
          }
          # The same line read the way releases up to v1.0 read it: the last
          # field. Those installs are the ones that have to accept this release.
          last="$(printf '%s' "$line" | awk '{print $NF}')"
          [ "$last" = "${TAG#v}" ] || {
            echo "::error::'$line' ends in '$last', not the version. Installs older than v1.0.1 parse the last field and would refuse this release."
            exit 1
          }

      # And now the hop that actually broke: an older install updating to this
      # one, over the real published assets.
      - name: The previous release updates to this one
        run: |
          set -euo pipefail
          # The greatest released tag strictly below this one. Taking "the
          # newest other release" would pick a NEWER tag whenever an older one
          # is re-released, and the update would then be refused as a
          # downgrade — failing the job for the wrong reason. This tag is added
          # to the list because --exclude-pre-releases drops it: it is being
          # held as a prerelease right now.
          prev="$(
            { gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq ".[].tagName"
              echo "$TAG"
            } | sort -uV | awk -v cur="$TAG" '$0 == cur { print prev; exit } { prev = $0 }'
          )"
          if [ -z "$prev" ]; then
            echo "::notice::no earlier full release to update from — nothing to check on this hop."
            exit 0
          fi
          echo "installing $prev, then updating it to $TAG"
          FOX_VERSION="$prev" sh deploy/install.sh
          installed="$(fox version | awk '{print $2}')"
          [ "$installed" = "${prev#v}" ] || { echo "::error::wanted $prev installed, got $installed"; exit 1; }

          # A throwaway HOME so this touches no state, and --version because the
          # release is still held as a prerelease.
          out="$(HOME="$(mktemp -d)" fox update --version "$TAG" --yes 2>&1 || true)"
          echo "$out"
          # `fox update` prints the version it *parsed*, which is canonicalised
          # to three parts (internal/host/host_update.go: "engine %s runs"
          # formats a Version). So a two-part tag like v2.0 appears as 2.0.0,
          # and grepping for the raw tag found nothing. It had only ever been
          # given three-part tags, where the two forms coincide -- v2.0 was the
          # first release this check could not pass, and it held a release whose
          # assets were all correct.
          want="${TAG#v}"
          case "$want" in
            *.*.*) ;;
            *.*)   want="$want.0" ;;
            *)     want="$want.0.0" ;;
          esac
          if printf '%s' "$out" | grep -qF "engine $want runs"; then
            echo "$prev accepts the $TAG engine."
          else
            echo "::error::$prev refused the $TAG engine (looked for \"engine $want runs\") — every install on $prev or older would be stuck. $TAG stays a prerelease."
            exit 1
          fi

      # Only now may a user be offered it.
      - name: Promote the release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --prerelease=false --latest
          echo "### $TAG promoted: an older install was shown to accept it" >> "$GITHUB_STEP_SUMMARY"
          echo "The Windows install path is still not covered by CI (A9) — smoke-test it on a real machine." >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: nightly-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["16", "18"]
        # The postgres base each is built on, pinned by digest (internal/branch/
        # images.go PostgresBaseDigests; a test keeps these in step).
        include:
          - pg: "16"
            base: sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
          - pg: "18"
            base: sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push PostgreSQL ${{ matrix.pg }} (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            PG_DIGEST=${{ matrix.base }}
          push: true
          # Build provenance and an SBOM travel with the image (audit v2 G22).
          provenance: mode=max
          sbom: true
          # The source label links the package to this repository, so it takes
          # the repository's permissions instead of starting out unlinked.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/thefoxbyte/postgres-walg:${{ matrix.pg }}
            ghcr.io/thefoxbyte/postgres-walg:${{ matrix.pg }}-${{ inputs.tag || github.ref_name }}

      # A signed statement that this image digest was built by this workflow.
      #   gh attestation verify oci://ghcr.io/thefoxbyte/postgres-walg:18 --repo thefoxbyte/foxbyte
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/thefoxbyte/postgres-walg
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
