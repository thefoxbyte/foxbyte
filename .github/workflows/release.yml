# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Cuts the GitHub release and attaches the binaries install.sh / install.ps1
# download. The ZFS bundle is attached separately by wsl-zfs.yml, which runs on
# the same tag — this job creates the release first so that upload has somewhere
# to go.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # build attestations (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build release artifacts
        run: make release VERSION="${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # install.ps1 fetches every one of these by name; a release missing any of
      # them installs a fox.exe that cannot then set itself up.
      - name: Assert the full asset set is present
        run: |
          set -eux
          test -f dist/fox-windows-amd64.exe
          test -f dist/fox-linux-amd64
          test -f dist/fox-linux-arm64
          test -f dist/fox-darwin-amd64
          test -f dist/fox-darwin-arm64
          # the independent Blackbox verifier (Blackbox 2.0)
          test -f dist/fox-verify-linux-amd64
          test -f dist/fox-verify-linux-arm64
          test -f dist/fox-verify-darwin-amd64
          test -f dist/fox-verify-darwin-arm64
          test -f dist/fox-verify-windows-amd64.exe
          test -f dist/foxbyte-docker-context.tar.gz

      # A software bill of materials for the source tree: every Go module and
      # npm package a release is built from (audit v2 G22).
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/foxbyte-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # GitHub build attestations: signed (Sigstore, keyless) statements that
      # each file was built by this workflow from this commit. Check one with
      #   gh attestation verify fox-linux-amd64 --repo thefoxbyte/foxbyte
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fox-*
            dist/foxbyte-docker-context.tar.gz
            dist/foxbyte-sbom.spdx.json

      # SHA256SUMS is signed with the release key (audit v2 G22): fox update and
      # install.sh refuse a release whose signature does not check. A missing
      # secret fails the release here, rather than publishing one nobody can
      # install. (cmd/releasesign also refuses a key fox would not accept.)
      - name: Build the release signer
        env:
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$FOX_RELEASE_SIGNING_KEY" || { echo "::error::the FOX_RELEASE_SIGNING_KEY secret is not set (see cmd/releasesign)"; exit 1; }
          go build -o "$RUNNER_TEMP/releasesign" ./cmd/releasesign

      # Created as a prerelease and left as a draft-free placeholder so
      # wsl-zfs.yml can upload the ZFS bundle into it. Promote it by hand once
      # the install has been smoke-tested on a clean Windows machine.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --generate-notes --title "$TAG"

      # Published so the installer can verify what it downloads. Without it the
      # only integrity guarantee is TLS, and these assets are executed as root
      # inside the user's distro.
      #
      # SHA256SUMS is shared with wsl-distro.yml, which runs on the same tag and
      # can finish before or after this job. The script merges this job's entries
      # into the published file by exact name, keeps the other job's, and checks
      # again after uploading — so neither job can drop the other's checksums
      # (v0.8.1 lost the distro image's entry that way).
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SIGN: ${{ runner.temp }}/releasesign
          FOX_RELEASE_SIGNING_KEY: ${{ secrets.FOX_RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          bash ../scripts/release-checksums.sh "$TAG" fox-* foxbyte-docker-context.tar.gz foxbyte-sbom.spdx.json

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/fox-* dist/foxbyte-docker-context.tar.gz dist/foxbyte-sbom.spdx.json --clobber

      # `fox update` only offers a release that has every file it needs for the
      # user's platform, listed in SHA256SUMS. Fail here rather than publish a
      # release nobody can update to.
      - name: Check the files fox update needs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/check-release-assets.sh "$TAG"

  # Publish the Postgres+wal-g image so `fox setup` pulls it (~30-60s) instead of
  # building it locally on every install (~2-5min, and dependent on the wal-g
  # release being reachable). ensureImage() falls back to building if the pull
  # fails, so this is an optimization, not a hard dependency.
  #
  # NOTE: the first push creates the ghcr.io/thefoxbyte/postgres-walg package as
  # PRIVATE. Make it public once (org → Packages → package → visibility) so
  # `docker pull` works without auth.
  #
  # One image per supported PostgreSQL major (internal/branch/images.go's
  # SupportedPGMajors; a test keeps this matrix in step with it). An install keeps
  # running the major its data was created with, so the older one must stay
  # pullable after a fresh install moves on.
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["16", "18"]
        # The postgres base each is built on, pinned by digest (internal/branch/
        # images.go PostgresBaseDigests; a test keeps these in step).
        include:
          - pg: "16"
            base: sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
          - pg: "18"
            base: sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push PostgreSQL ${{ matrix.pg }} (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            PG_DIGEST=${{ matrix.base }}
          push: true
          # Build provenance and an SBOM travel with the image (audit v2 G22).
          provenance: mode=max
          sbom: true
          # The source label links the package to this repository, so it takes
          # the repository's permissions instead of starting out unlinked.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/thefoxbyte/postgres-walg:${{ matrix.pg }}
            ghcr.io/thefoxbyte/postgres-walg:${{ matrix.pg }}-${{ inputs.tag || github.ref_name }}

      # A signed statement that this image digest was built by this workflow.
      #   gh attestation verify oci://ghcr.io/thefoxbyte/postgres-walg:18 --repo thefoxbyte/foxbyte
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/thefoxbyte/postgres-walg
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
