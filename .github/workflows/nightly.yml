# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The integration suites, nightly (audit v2 G24). Until now they ran only by
# hand in a throwaway VM, so the features FoxByte is for — branching, wake on
# connect, point-in-time restore, HA failover, the Blackbox's triggers, the
# clients and the console — were the ones CI never touched, and a regression in
# them could ship.
#
# They are destructive by design (they wipe Blackbox history, restore main to an
# earlier point, fail HA over and uninstall the stack), so each runs on a runner
# of its own, which is thrown away afterwards: that is what
# FOX_TEST_ALLOW_REAL_INSTALL is for (scripts/lib/test_guard.sh).
name: nightly

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, every day
  workflow_dispatch:
    inputs:
      suite:
        description: 'One suite to run (default: all)'
        required: false
        type: choice
        options: ['', integration, ledger-v2, realtime, update, pg-upgrade, sdks, ui, upgrade]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, ledger-v2, realtime, update, pg-upgrade, sdks, ui, upgrade]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The upgrade suite builds each recent tag from its own source, so it
          # needs the tags and their history. The default is depth 1 with
          # neither, and that suite would then have nothing to test — it says so
          # and fails rather than passing empty.
          fetch-depth: 0
      - if: ${{ inputs.suite == '' || inputs.suite == matrix.suite }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the image's cached one
      - if: ${{ (inputs.suite == '' || inputs.suite == matrix.suite) && (matrix.suite == 'ui' || matrix.suite == 'sdks') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22: jsdom 30 (the component tests' DOM) declares
          # engines ^22.22.2, and on 20 it fails at import with
          # `webidl.util.markAsUncloneable is not a function` before a
          # single test runs. GitHub had already begun warning that
          # Node 20 is deprecated on their runners, so this was owed
          # anyway rather than something the tests forced.
          node-version: '22'
          cache: npm
          # Both lockfiles, because both suites install: ui builds the console
          # from web/, and sdks builds the published TypeScript client from
          # clients/typescript/. Keyed on web/ alone, a change to the client's
          # dependencies left the key untouched and the cache stale.
          cache-dependency-path: |
            web/package-lock.json
            clients/typescript/package-lock.json

      # ZFS is the storage engine branches are clones on. The runner's kernel
      # needs its module; without it there is nothing to test, so say so plainly
      # rather than failing later inside the engine.
      - name: Install ZFS, psql and the rest
        # Not for `upgrade`: it drives `fox update` only as far as the staged-engine
        # check, which on Linux is a file copy and a `version` call, so it needs no
        # pool, no containers and no install of its own.
        if: ${{ (inputs.suite == '' || inputs.suite == matrix.suite) && matrix.suite != 'upgrade' }}
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux postgresql-client jq python3 curl openssl
          sudo modprobe zfs || {
            echo "::error::this runner's kernel has no ZFS module, so the suites cannot run here"
            exit 1
          }
          zfs version
          docker --version

      - name: Build the engine
        if: ${{ (inputs.suite == '' || inputs.suite == matrix.suite) && matrix.suite != 'upgrade' }}
        run: |
          set -eux
          # An Enterprise build with a throwaway licence. The suites test
          # features, and seven of those need a licence now -- against a
          # Standard build they test the refusal instead, which is what broke
          # four of these suites the night the gating landed. The refusals have
          # tests of their own (scripts/test_editions.sh, and section 1 of
          # integration_realtime.sh).
          if [ "${{ matrix.suite }}" = "update" ]; then
            # The update mechanism is free and identical in both editions, and
            # `fox update` keeps an install inside its own edition -- so an
            # Enterprise build here would need the fake release to publish
            # fox-enterprise-* assets as well, to test something that does not
            # differ. Standard it is.
            go build -o /tmp/fox ./cmd/fox
          elif [ "${{ matrix.suite }}" = "ui" ]; then
            # `make web-build` builds it same-origin (VITE_API_URL=); a plain
            # `vite build` leaves the console calling http://localhost:8080,
            # and every request from the page fails.
            make web-build
            scripts/build_test_fox.sh /tmp/fox embedui   # the console's tests need the UI embedded
          else
            scripts/build_test_fox.sh /tmp/fox
          fi
          go build -o /tmp/fox-verify ./cmd/fox-verify
          sudo install -m 0755 /tmp/fox /usr/local/bin/fox  # `fox update` hands the stack back to this path

      # Build the Postgres image from THIS tree, tagged the way the engine names
      # it, so ensureImageRef finds it already present and never pulls.
      #
      # Without this the nightly tests a published image against current source.
      # That is not a theoretical gap: pgvector was added to the Dockerfile on 28
      # Sep, the newest published image was from 23 Sep, and the suite's pgvector
      # assertions failed against an image that could not have had it. Worse, the
      # image is only republished by a release — and a release needs a green
      # nightly — so nothing could move. A Dockerfile change must be testable
      # before it ships, not after.
      #
      # No build args: the Dockerfile's own defaults are the fresh-install values,
      # and TestPostgresMajorIsInStepEverywhere holds them to internal/branch/
      # images.go. The major is read from there for the same reason. Single
      # architecture and no buildx — this runner only ever runs the image natively.
      - name: Build the engine image from this tree
        if: ${{ (inputs.suite == '' || inputs.suite == matrix.suite) && matrix.suite != 'upgrade' }}
        run: |
          set -euo pipefail
          major="$(grep -oE 'PGMajor += +"[0-9]+"' internal/branch/images.go | grep -oE '[0-9]+')"
          repo="$(grep -oE 'ImageRepo += +"[^"]+"' internal/brand/brand_gen.go | sed 's/.*"\(.*\)"/\1/')"
          [ -n "$major" ] && [ -n "$repo" ] || { echo "::error::could not read the image name from the engine"; exit 1; }
          echo "building $repo/postgres-walg:$major from docker/postgres"
          # The Dockerfile checks its own work (it lists vector.control after the
          # install), so a build that succeeds is an image with pgvector in it.
          docker build -t "$repo/postgres-walg:$major" docker/postgres

      - name: Run the ${{ matrix.suite }} suite
        if: ${{ inputs.suite == '' || inputs.suite == matrix.suite }}
        env:
          # This runner is disposable, which is the one case the guard allows.
          FOX_TEST_ALLOW_REAL_INSTALL: yes-destroy-my-data
        run: |
          set -o pipefail
          case "${{ matrix.suite }}" in
            integration) script=scripts/integration_test.sh ;;
            ledger-v2)   script=scripts/integration_ledger_v2.sh ;;
            realtime)    script=scripts/integration_realtime.sh ;;
            update)      script=scripts/integration_update.sh ;;
            pg-upgrade)  script=scripts/integration_pg_upgrade.sh ;;
            sdks)        script=scripts/integration_sdks.sh ;;
            ui)          script=scripts/integration_ui.sh ;;
            upgrade)     script=scripts/integration_upgrade.sh ;;
          esac
          bash "$script" 2>&1 | tee "/tmp/${{ matrix.suite }}.log"

      # The engine's own logs. The suite's stdout says which assertion failed; only
      # these say why — a panic, a refused connection, a container that would not
      # start. They lived in a home directory on a runner that is then destroyed,
      # so a failure that did not reproduce locally could not be diagnosed at all.
      # Collected under sudo and made readable: the stack runs as root.
      - name: Collect the engine logs
        if: ${{ failure() }}
        run: |
          set -u
          mkdir -p /tmp/engine-logs
          for d in "$HOME/.fox" /root/.fox; do
            sudo test -d "$d" || continue
            sudo cp -a "$d"/*.log /tmp/engine-logs/ 2>/dev/null || true
          done
          sudo docker ps -a > /tmp/engine-logs/docker-ps.txt 2>&1 || true
          sudo chmod -R a+r /tmp/engine-logs || true
          ls -la /tmp/engine-logs || true

      # The log is the whole story of a failure; the Playwright artefacts carry
      # the screenshot and trace of a failed console test.
      - name: Keep the log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite }}-log
          path: |
            /tmp/${{ matrix.suite }}.log
            /tmp/engine-logs/**
            /tmp/fox-ui-e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
