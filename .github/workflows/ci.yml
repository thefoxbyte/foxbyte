# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Linux CI: build, vet, and unit-test on every push and PR. The primary platform
# had no automated Go test/vet coverage before (only windows-ci.yml ran tests,
# on Windows) — so a regression on Linux/macOS could land unnoticed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Both editions. Without the tag, enterprise/ is only its untagged
      # placeholder files, so `go build`, `go vet` and `go test` above never look
      # at the paid code at all — a break there would reach a release unseen.
      - name: Build (enterprise)
        run: go build -tags enterprise ./...
      - name: Vet (enterprise)
        run: go vet -tags enterprise ./...
      - name: Test (enterprise)
        run: go test -tags enterprise ./...
      # The edition boundary, checked against the linked binaries: the Standard
      # build must contain no code from enterprise/, because that is what keeps it
      # purely AGPL and freely redistributable.
      - name: Edition boundary
        run: bash scripts/test_editions.sh
      # Under the race detector as well (audit v2 G25). The engine has real
      # concurrency — the backup and checkpoint schedulers, the gateway's
      # per-connection goroutines, and an auth store three services open at
      # once — and a data race there is the kind of fault that shows up as an
      # occasional impossible value rather than a failing test.
      - name: Test (race detector)
        run: go test -race ./...
      # The release workflows share one SHA256SUMS; this checks the script that
      # merges into it never drops another job's entries.
      - name: Release checksum merging
        run: bash scripts/test_release_checksums.sh
      # The release job's check that every file `fox update` needs was published.
      - name: Release assets for fox update
        run: bash scripts/test_check_release_assets.sh
      # The installer must refuse anything it cannot check against SHA256SUMS.
      - name: Installer verification
        run: bash scripts/test_install_sh.sh
      # The gate that stops a tag shipping past a red nightly. A gate wrong in
      # either direction is worse than none, so its own shell is exercised.
      - name: Release gate on the nightly suites
        run: bash scripts/test_nightly_gate.sh
      # docs/FOX_Checklist.html must list exactly the features in FOX_Feature_Implemented.html.
      - name: Feature checklist in step
        run: bash scripts/test_feature_checklist.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

  # Preventive checks the repository had none of (audit v2, G25). A private key
  # was once committed here; secret scanning would have stopped it.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      # The files as they are now, not the history: the key committed on 18 Sep
      # is still in history, and has to be revoked where it was trusted, not
      # scanned for on every run.
      - name: Secrets (gitleaks)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 dir . --redact --no-banner
      - name: Known vulnerabilities in Go code and dependencies (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # And again with the paid code compiled in. govulncheck analyses the
      # packages a build actually loads, so without the tag nothing under
      # enterprise/ is scanned at all -- nor the dependencies only it uses.
      # That hole opened the moment the paid code moved behind the build tag,
      # and it is exactly where a dependency nobody else links would hide.
      - name: Known vulnerabilities in the Enterprise build (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags=enterprise ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22: jsdom 30 (the component tests' DOM) declares
          # engines ^22.22.2, and on 20 it fails at import with
          # `webidl.util.markAsUncloneable is not a function` before a
          # single test runs. GitHub had already begun warning that
          # Node 20 is deprecated on their runners, so this was owed
          # anyway rather than something the tests forced.
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # vite build does not type-check, so a type error in the UI passed CI.
      - name: Type-check
        run: npx tsc --noEmit -p .
      # The console's own tests. Everything else in this job checks that the
      # code compiles; nothing checked that it still behaves, and until now the
      # only thing that did was Playwright against a live stack in the nightly.
      # A nightly on 3 Oct failed four console tests at once, none of them a
      # product bug — a removed heading, a renamed button, a cell that had
      # become an expander — and all four had passed this job.
      - name: Component tests
        working-directory: web
        run: npm test

      - name: Dependencies with known vulnerabilities (runtime only)
        run: npm audit --omit=dev --audit-level=high
