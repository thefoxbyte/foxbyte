# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Mirrors the object-store images into this project's own registry.
#
# MinIO's images have moved twice: off Docker Hub in 2026, and then behind
# authentication on quay.io — every tag there, including `latest`, now answers 401
# to an anonymous pull. A fresh install on macOS or Linux cannot start without
# them (the engine runs MinIO for the WAL archive and base backups), so FoxByte
# stopped being installable on those platforms the day that changed, while
# existing installs carried on from their local cache.
#
# The bytes come from FoxByte's own published release, not from a registry: the
# Windows distro image has always carried these images preloaded
# (deploy/wsl-distro/build.sh), and that distro is a release asset. So the images
# can be taken out of it and pushed to ghcr.io/thefoxbyte with the token this
# workflow already has — no quay account, no new secret, and nothing to pull from
# a registry that will not serve us.
#
# Run it once per image version:
#
#   gh workflow run mirror-images.yml -f tag=v0.4
#
# GitHub only dispatches a workflow it can find on the default branch, so this has
# to be merged before that command works — `--ref` chooses which code runs, not
# where the workflow is looked up. Until it is merged, the release check below is
# what stops an unpinned version shipping.
#
# It prints the digests it pushed. Those go into internal/branch/images.go (the
# distro build reads them from there), and the packages have to be made public once,
# in the repository's package settings — the engine pulls them anonymously.
# .github/workflows/release.yml refuses to publish while they are unpinned.
name: mirror-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release whose distro asset holds the images (e.g. v0.4)'
        required: true
      expect_minio_digest:
        description: 'Fail unless the pushed MinIO digest is this (leave empty on the first run)'
        required: false
      expect_mc_digest:
        description: 'Fail unless the pushed mc digest is this (leave empty on the first run)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Where the images are going: the names a fresh install looks for, read from
      # the engine rather than repeated here.
      #
      # Where they come from is a different question, and deliberately not this:
      # the release's distro image was built when the engine still pulled from
      # quay.io, so the images inside it carry those names. Resolving the source
      # from the destination was wrong and failed — the source is found in the tar
      # by what the image is, so this keeps working whatever registry the engine
      # names next.
      - name: Read the destination names from the engine
        id: names
        run: |
          set -euo pipefail
          minio="$(grep -oE 'MinioTag *= *"[^"]+"' internal/branch/images.go | sed 's/.*"\(.*\)"/\1/')"
          mc="$(grep -oE 'MCTag *= *"[^"]+"' internal/branch/images.go | sed 's/.*"\(.*\)"/\1/')"
          [ -n "$minio" ] && [ -n "$mc" ] || { echo "::error::could not read the image tags from internal/branch/images.go"; exit 1; }
          echo "minio=$minio" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "a fresh install expects: $minio and $mc"

      - name: Take the images out of the published distro image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'foxbyte-distro.tar.zst' --dir /tmp
          # Only the one file: the distro is a whole root filesystem.
          tar --zstd -xf /tmp/foxbyte-distro.tar.zst -C /tmp ./usr/local/share/dbengine/images/foxbyte-images.tar
          docker load -i /tmp/usr/local/share/dbengine/images/foxbyte-images.tar
          docker images --format '{{.Repository}}:{{.Tag}}'
          # The object store's two images, whatever registry the distro pulled them
          # from: the server is the one whose repository ends in /minio, the client
          # the one ending in /mc.
          # `|| true`: with `set -e`, a grep that matches nothing would end the step
          # here, before the message below could say what was wrong.
          find_one() {
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E "/$1:" | grep -v '<none>' | head -1 || true
          }
          src_minio="$(find_one minio)"; src_mc="$(find_one mc)"
          [ -n "$src_minio" ] && [ -n "$src_mc" ] || {
            echo "::error::the distro image from ${{ inputs.tag }} does not carry both object-store images"; exit 1; }
          echo "src_minio=$src_minio" >> "$GITHUB_ENV"
          echo "src_mc=$src_mc" >> "$GITHUB_ENV"
          echo "found in the distro: $src_minio and $src_mc"

      - name: Push them to this project's registry
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          MINIO: ${{ steps.names.outputs.minio }}
          MC: ${{ steps.names.outputs.mc }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          push_one() { # <source ref from the distro> <destination ref> -> the digest
            local src="$1" dest="$2" digest
            docker image inspect "$src" >/dev/null || {
              echo "::error::$src is not in the distro image from ${{ inputs.tag }}"; exit 1; }
            # The version the engine asks for has to be the one being mirrored, or a
            # fresh install would look for a tag this never pushed.
            [ "${src##*:}" = "${dest##*:}" ] || {
              echo "::error::the distro carries ${src##*:} but the engine asks for ${dest##*:} — mirror the release that matches, or update internal/branch/images.go"; exit 1; }
            docker tag "$src" "$dest"
            # Everything this function prints is taken as the digest, so the push's
            # own output goes to the log, not into the value: `docker push -q` still
            # prints a line, and the two together made a two-line "digest" that the
            # runner refused to store as a step output.
            docker push -q "$dest" >&2
            digest="$(docker buildx imagetools inspect "$dest" --format '{{.Manifest.Digest}}' | tail -n1 | tr -d '[:space:]')"
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "::error::pushing $dest gave \"$digest\" as its digest, which is not one" >&2; exit 1 ;;
            esac
            printf '%s' "$digest"
          }
          minio_digest="$(push_one "$src_minio" "$MINIO")"
          mc_digest="$(push_one "$src_mc" "$MC")"
          echo "minio_digest=$minio_digest" >> "$GITHUB_OUTPUT"
          echo "mc_digest=$mc_digest" >> "$GITHUB_OUTPUT"
          # Also to the log. The step summary is the readable version, but it cannot
          # be read back with `gh run view`, so the one thing this workflow exists to
          # produce was only available by opening the page.
          echo "pushed $MINIO@$minio_digest"
          echo "pushed $MC@$mc_digest"
          {
            echo "### Mirrored"
            echo
            echo '```go'
            echo "MinioImage = MinioTag + \"@$minio_digest\""
            echo "MCImage    = MCTag + \"@$mc_digest\""
            echo '```'
            echo
            echo "Put those in \`internal/branch/images.go\` and \`deploy/wsl-distro/build.sh\`."
            echo "**Make both packages public** once, in the repository's package settings:"
            echo "the engine pulls them without credentials."
          } >> "$GITHUB_STEP_SUMMARY"

      # A pin is only worth having if it is checked. On a later run, pass the
      # digests the code pins and this fails if the push produced anything else.
      - name: The pushed digests must be the ones the code pins
        if: ${{ inputs.expect_minio_digest != '' || inputs.expect_mc_digest != '' }}
        env:
          GOT_MINIO: ${{ steps.push.outputs.minio_digest }}
          GOT_MC: ${{ steps.push.outputs.mc_digest }}
          WANT_MINIO: ${{ inputs.expect_minio_digest }}
          WANT_MC: ${{ inputs.expect_mc_digest }}
        run: |
          set -euo pipefail
          fail=0
          check() { # <what> <got> <want>
            [ -z "$3" ] && return 0
            if [ "$2" != "$3" ]; then
              echo "::error::$1 was pushed as $2, but the code pins $3"; fail=1
            else
              echo "$1 matches the pin ($3)"
            fi
          }
          check MinIO "$GOT_MINIO" "$WANT_MINIO"
          check mc "$GOT_MC" "$WANT_MC"
          exit "$fail"
