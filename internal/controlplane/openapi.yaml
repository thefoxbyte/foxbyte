# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The canonical OpenAPI description of FoxByte's HTTP APIs. It is embedded in
# the control-plane binary and served at GET /api/openapi.yaml, so any generator
# can produce a typed client. The hand-written SDKs under clients/ are thin
# wrappers over these same endpoints.
openapi: 3.1.0
info:
  title: FoxByte API
  version: "0.7"
  description: >
    Control-plane and Agent Branch APIs for FoxByte — serverless PostgreSQL
    with instant branching, time-travel, and Blackbox — a tamper-evident record of
    every schema change. Every `/api/branches/{name}/ledger…` path is also served
    at `/api/branches/{name}/blackbox…`.
    All endpoints are served over TLS. Authenticate with an API key
    (`key_…`) as a Bearer token.
  license:
    name: AGPL-3.0-or-later
servers:
  - url: https://localhost:8080
    description: Control-plane API
  - url: https://localhost:8088
    description: Agent Branch API
security:
  - apiKey: []
tags:
  - name: status
  - name: branches
  - name: ledger
    description: >-
      Blackbox, the record of every schema change. Each path below is also served with
      `/blackbox` in place of `/ledger` (for example /api/branches/{name}/blackbox/verify).
  - name: policies
    description: The Blackbox policy gate — rules checked on every schema change before it runs (docs/policy-errors.md).
  - name: pipelines
  - name: import
  - name: backups
    description: Base backups in object storage — what a point-in-time restore (`fox restore --to`) can start from.
  - name: keys
  - name: agents
  - name: auth
    description: Browser sign-in and sessions (cookie-based; no API key needed).

paths:
  /api/openapi.yaml:
    get:
      tags: [status]
      security: []
      summary: This API description (OpenAPI, YAML). Point a client generator at it.
      responses:
        "200":
          description: OK
          content:
            application/yaml: { schema: { type: string } }

  /api/status:
    get:
      tags: [status]
      summary: Primary readiness, branch/agent counts, HA, storage, and per-server liveness.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches:
    get:
      tags: [branches]
      summary: List branches (state, size, connections).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Branch" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [branches]
      summary: Create an instant copy-on-write branch of main.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: qa }
                from: { type: string, example: main, description: "The branch to copy (default main)." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  status: { type: string, example: created }
        "400": { description: "Invalid name or from (lowercase letters, digits and dashes)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The branch named in from doesn't exist. }
        "409": { description: That branch already exists. }

  /api/branches/{name}:
    delete:
      tags: [branches]
      summary: Delete a branch.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/suspend:
    post:
      tags: [branches]
      summary: Suspend a branch (stop its compute; data preserved).
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses: { "200": { description: Suspended }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/branches/{name}/resume:
    post:
      tags: [branches]
      summary: Resume a suspended branch.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses: { "200": { description: Resumed }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/branches/{name}/query:
    post:
      tags: [branches]
      summary: Run SQL against a branch (time-bounded, row-capped).
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: { type: string, example: "SELECT 1" }
                allow_destructive:
                  type: boolean
                  description: >-
                    Apply SET bb.allow_destructive=on to this query. Counts only
                    when the signed-in user is in db_admin on the branch (see
                    /admins); anyone else stays blocked. The query runs as the
                    signed-in user's own role.
                allow_rules:
                  type: array
                  items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                  description: >-
                    Apply SET bb.policy_allow to this query: the per-rule override
                    for a Blackbox policy block (BBX01), which allow_destructive
                    does not cover. Counts only for db_admin members.
      responses:
        "200":
          description: Columns and rows, or an error message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger:
    get:
      tags: [ledger]
      summary: The branch's Blackbox history (filterable).
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: actor, in: query, schema: { type: string } }
        - { name: table, in: query, schema: { type: string } }
        - { name: risk, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [human, agent] } }
        - { name: since, in: query, description: "Only entries at or after this time.", schema: { type: string } }
        - { name: until, in: query, description: "Only entries at or before this time.", schema: { type: string } }
        - { name: with, in: query, description: "Extra columns, comma-separated: session. The default columns never change.", schema: { type: string, example: session } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Blackbox rows.
          content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/verify:
    get:
      tags: [ledger]
      summary: Recompute the Blackbox hash chain and report whether it is intact.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: "Columns: legacy, chained, broken, first_broken."
          content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/integrity:
    get:
      tags: [ledger]
      summary: Check the Blackbox record against its checkpoint anchors, which are stored outside the database.
      description: >
        Detects edited, deleted or wiped history even when the in-database hash chain was
        rewritten to hide it. Rows written after the last checkpoint are only hash-chain checked.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: Integrity report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact: { type: boolean }
                  rows: { type: integer }
                  chained_rows: { type: integer }
                  legacy_rows: { type: integer }
                  checkpoints: { type: integer }
                  anchored_rows: { type: integer }
                  unanchored_rows: { type: integer }
                  first_broken_id: { type: integer }
                  problems: { type: array, items: { type: string } }
                  notes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/checkpoint:
    post:
      tags: [ledger]
      summary: Anchor the Blackbox entries added since the last checkpoint.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: Nothing new to checkpoint (checkpoint is null).
        "201":
          description: Checkpoint created; the anchor follows docs/ledger-anchor-format.md.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: created }
                  anchor_path: { type: string }
                  checkpoint:
                    type: object
                    properties:
                      format: { type: string, example: ledger-anchor/1 }
                      algorithm: { type: string, example: sha256-merkle-v1 }
                      branch: { type: string }
                      checkpoint_id: { type: integer }
                      from_id: { type: integer }
                      to_id: { type: integer }
                      entry_count: { type: integer }
                      last_row_hash: { type: string }
                      merkle_root: { type: string }
                      prev_root: { type: string }
                      created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/export:
    get:
      tags: [ledger]
      summary: Every Blackbox entry with its capture columns, one JSON document per line.
      description: The input fox-verify checks offline with --export.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: JSON lines.
          content: { application/x-ndjson: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/entries:
    get:
      tags: [ledger]
      summary: Newest Blackbox entries with their ids, newest first.
      description: The ids are what POST /api/branches/{name}/ledger/{id}/branch takes.
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    at: { type: string, format: date-time }
                    actor: { type: string }
                    command_tag: { type: string }
                    object_identity: { type: string }
                    status: { type: string }
                    risk: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/sessions:
    get:
      tags: [ledger]
      summary: Agent sessions on the branch — agent, task, parent session and how many Blackbox entries each caused.
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    session_id: { type: string }
                    agent_id: { type: string }
                    parent_session_id: { type: [string, "null"] }
                    task_id: { type: [string, "null"] }
                    tool: { type: [string, "null"] }
                    started_at: { type: string, format: date-time }
                    entries: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/impact:
    post:
      tags: [ledger]
      summary: What a change would affect — dependents, other branches that have the object, policy verdict, score. Nothing is run.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send sql, or object (and optionally column).
              properties:
                sql: { type: string, example: "ALTER TABLE orders DROP COLUMN note" }
                object: { type: string, description: A table, view, materialized view, index or sequence }
                column: { type: string }
      responses:
        "200":
          description: The impact report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch: { type: string }
                  action: { type: string }
                  destructive: { type: boolean }
                  found: { type: boolean }
                  target: { type: string }
                  type: { type: string }
                  column: { type: [string, "null"] }
                  rows_estimate: { type: integer }
                  size_bytes: { type: integer }
                  dependents: { type: array, items: { type: object } }
                  truncated: { type: boolean }
                  branches: { type: array, items: { type: object } }
                  policy: { type: array, items: { $ref: "#/components/schemas/PolicyDetail" } }
                  score: { type: integer }
                  level: { type: string, enum: [none, low, medium, high] }
                  reasons: { type: array, items: { type: string } }
        "400": { description: Neither sql nor object, or a statement whose target isn't recognised. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/ledger/{id}/branch:
    post:
      tags: [ledger]
      summary: Create a branch holding main as it was just before a Blackbox entry.
      description: >-
        Restores the newest base backup that finished before the entry and replays archived WAL up to,
        but not including, the entry's transaction (or its time, for entries recorded before Blackbox 2.0
        capture). Synchronous; typically takes a few minutes. Only main can be the source.
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: Blackbox entry id }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "New branch name (default <branch>-before-<id>)" }
      responses:
        "201":
          description: The branch is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch: { type: string }
                  source: { type: string }
                  entry_id: { type: integer }
                  command_tag: { type: string }
                  object_identity: { type: string }
                  statement: { type: string }
                  target_kind: { type: string, enum: [xid, time] }
                  target: { type: string }
                  base_backup: { type: string }
                  last_ledger_id: { type: integer }
                  seconds: { type: integer }
        "400": { description: Invalid entry id, name, source branch, or a BLOCKED entry. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such Blackbox entry. }
        "409": { description: A branch with that name already exists. }
        "422": { description: No base backup finished before the entry. }

  /api/branches/{name}/policies:
    get:
      tags: [policies]
      summary: The branch's policy rules.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: Rules.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [policies]
      summary: Add a rule (db_admin only).
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyRule" } } }
      responses:
        "201": { description: Added. }
        "400": { description: Invalid rule (id, command tag, action, reason or pattern). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The signed-in user is not a db_admin member on this branch. }
        "409": { description: A rule with that id exists. }

  /api/branches/{name}/policies/{rule}:
    put:
      tags: [policies]
      summary: Change a rule's action and/or whether it is enabled (db_admin only).
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: rule, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [warn, block] }
                enabled: { type: boolean }
      responses:
        "200": { description: Changed. }
        "400": { description: Nothing or something invalid to change. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a db_admin member. }
        "404": { description: No such rule. }
    delete:
      tags: [policies]
      summary: Remove a custom rule (db_admin only; built-in rules can only be disabled).
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: rule, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a db_admin member. }
        "404": { description: No such rule. }
        "409": { description: Built-in rule. }

  /api/branches/{name}/policies/check:
    post:
      tags: [policies]
      summary: Preview the rules a statement would trigger, without running it.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { sql: { type: string } }, required: [sql] } } }
      responses:
        "200":
          description: The command tag assumed and the matching rules (blocks first), as contract v1 objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  command: { type: string }
                  matches: { type: array, items: { $ref: "#/components/schemas/PolicyDetail" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/policies/evaluations:
    get:
      tags: [policies]
      summary: Recent warnings, blocks and overrides, newest first.
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 1000 } }
      responses:
        "200": { description: Evaluations., content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/admins:
    get:
      tags: [policies]
      summary: Who may override blocking rules on this branch, and whether the caller may.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins: { type: array, items: { type: string }, description: "Emails in db_admin (superusers are not listed)." }
                  you: { type: string }
                  you_are_admin: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [policies]
      summary: Let a user override blocking rules on this branch (needs db_admin).
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Granted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The caller is not in db_admin on this branch. }
        "404": { description: No account with that email. }

  /api/branches/{name}/admins/{email}:
    delete:
      tags: [policies]
      summary: Remove a user's permission to override (needs db_admin).
      parameters:
        - { $ref: "#/components/parameters/BranchName" }
        - { name: email, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The caller is not in db_admin on this branch. }
        "404": { description: That user is not an admin here. }
        "409": { description: That user is the only admin; grant someone else first. }

  # Blackbox is the product name for the ledger: every path above is served
  # under /blackbox as well. These aliases mirror them exactly.
  /api/branches/{name}/blackbox:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger"

  /api/branches/{name}/blackbox/verify:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1verify"

  /api/branches/{name}/blackbox/integrity:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1integrity"

  /api/branches/{name}/blackbox/checkpoint:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1checkpoint"

  /api/branches/{name}/blackbox/export:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1export"

  /api/branches/{name}/blackbox/entries:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1entries"

  /api/branches/{name}/blackbox/sessions:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1sessions"

  /api/branches/{name}/blackbox/{id}/branch:
    $ref: "#/paths/~1api~1branches~1{name}~1ledger~1{id}~1branch"

  /api/ledger/diff:
    get:
      tags: [ledger]
      summary: Schema changes made on each of two branches since they split, and objects both changed. Read-only.
      parameters:
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  a: { type: string }
                  b: { type: string }
                  a_parent: { type: string }
                  b_parent: { type: string }
                  common_entries: { type: integer }
                  fork_after_id: { type: integer }
                  fork_after_at: { type: string, format: date-time }
                  a_only: { type: array, items: { type: object } }
                  b_only: { type: array, items: { type: object } }
                  both_touched: { type: array, items: { type: object } }
        "400": { description: a or b missing. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such branch. }

  /api/blackbox/diff:
    get:
      tags: [ledger]
      summary: Schema changes made on each of two branches since they split, and objects both changed. Read-only.
      parameters:
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  a: { type: string }
                  b: { type: string }
                  a_parent: { type: string }
                  b_parent: { type: string }
                  common_entries: { type: integer }
                  fork_after_id: { type: integer }
                  fork_after_at: { type: string, format: date-time }
                  a_only: { type: array, items: { type: object } }
                  b_only: { type: array, items: { type: object } }
                  both_touched: { type: array, items: { type: object } }
        "400": { description: a or b missing. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such branch. }

  /api/import:
    post:
      tags: [import]
      summary: Import from a database connection string or a file path into a fresh branch.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, description: "postgres://…, mysql://…, mariadb://…, or mongodb://… — a connection string (this endpoint rejects file paths; use /api/import/file)" }
                target: { type: string, description: "Branch to create (default: derived from the source)." }
                continuous: { type: boolean, description: "Keep replicating after the first copy, rather than a one-off import." }
      responses:
        "200":
          description: >-
            Server-sent events as the import runs, ending with a `done` event
            ({status, target, tables}) or an `error` event. `status` is
            "replicating" when continuous was set, otherwise "imported".
          content:
            text/event-stream: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/import/file:
    post:
      tags: [import]
      summary: Import an uploaded .sql/.csv/.json/.ndjson file into a fresh branch.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "The kind is inferred from the filename extension." }
                target: { type: string, description: "Branch to create (default: derived from the filename)." }
      responses:
        "200":
          description: Server-sent events, ending with a `done` or `error` event.
          content:
            text/event-stream: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/backups:
    get:
      tags: [backups]
      summary: Base backups in object storage, newest first.
      description: >
        What a point-in-time restore can start from. A restore can only reach a point that a
        base backup precedes, so the oldest entry here is the earliest reachable point.
        Performing a restore is `fox restore --to <timestamp|latest>`, which is not in this API.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Backup" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/replication:
    get:
      tags: [import]
      summary: The running branches that have a continuous import, and where each stands.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Replication" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/branches/{name}/replication:
    get:
      tags: [import]
      summary: Where a branch's continuous import stands (replicating is false if it has none).
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Replication" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such branch. }

  /api/branches/{name}/replication/cutover:
    post:
      tags: [import]
      summary: Stop a continuous import, keeping its data — the branch becomes standalone.
      parameters: [{ $ref: "#/components/parameters/BranchName" }]
      responses:
        "200":
          description: Cut over.
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch: { type: string }
                  status: { type: string, example: standalone }
                  tables: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such branch. }
        "409": { description: The branch has no continuous import to cut over. }

  /api/pipelines:
    get:
      tags: [pipelines]
      summary: List ETL pipelines.
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [pipelines]
      summary: Create an ETL pipeline.
      responses: { "200": { description: Created }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/pipelines/{id}:
    get:
      tags: [pipelines]
      summary: Get a pipeline.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    put:
      tags: [pipelines]
      summary: Update a pipeline.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Updated }, "401": { $ref: "#/components/responses/Unauthorized" } }
    delete:
      tags: [pipelines]
      summary: Delete a pipeline.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Deleted }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/pipelines/{id}/runs:
    get:
      tags: [pipelines]
      summary: List a pipeline's runs.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/pipelines/{id}/run:
    post:
      tags: [pipelines]
      summary: Run a pipeline (streams logs via SSE).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Started }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/keys:
    get:
      tags: [keys]
      summary: List the caller's API keys.
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [keys]
      summary: Mint a new API key (the secret is returned once).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } }
      responses: { "201": { description: "Created; the plaintext key is shown once." }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /api/keys/{id}:
    delete:
      tags: [keys]
      summary: Revoke an API key.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Revoked }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Create an account and start a browser session (sets the session cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                setup_token:
                  type: string
                  description: Required for the first account on an install, and ignored after it. `fox start` prints it; `fox setup-token` shows it again.
      responses:
        "201":
          description: Created; the session cookie is set.
          content:
            application/json:
              schema: { type: object, properties: { user: { type: object } } }
        "400": { description: The password is shorter than 8 characters. }
        "403": { description: "The first account needs the setup token, or sign-up is closed (the default; FOX_SIGNUP=open opens it)." }
        "409": { description: That email is already registered. }
        "429": { description: Too many failed setup-token attempts from this address; see Retry-After. }

  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Sign in with email and password (sets the session cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema: { type: object, properties: { user: { type: object } } }
        "401": { description: Invalid credentials. }
        "429": { description: "Too many failed sign-ins for this address or this email (10 in 15 minutes); see Retry-After." }

  /auth/logout:
    post:
      tags: [auth]
      security: []
      summary: End the browser session and clear the cookie.
      responses:
        "200": { description: Signed out. }

  /auth/me:
    get:
      tags: [auth]
      security: []
      summary: The signed-in user.
      responses:
        "200":
          description: Always 200 — `user` is null when there is no session.
          content:
            application/json:
              schema: { type: object, properties: { user: { type: object } } }

  /auth/providers:
    get:
      tags: [auth]
      security: []
      summary: Which sign-in methods this deployment offers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  github: { type: boolean }
                  google: { type: boolean }
                  signup: { type: boolean, description: Whether the sign-up form can be used — for the first account (with the setup token), or because FOX_SIGNUP=open. }
                  setup: { type: boolean, description: The install has no account yet; the next sign-up needs the setup token. }

  /auth/oauth/{provider}:
    get:
      tags: [auth]
      security: []
      summary: Begin the OAuth flow (browser redirect).
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [github, google] } }
      responses:
        "302": { description: Redirect to the provider. }

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      security: []
      summary: Where the provider sends the browser back; creates the session.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [github, google] } }
      responses:
        "302": { description: Redirect back to the web console. }

  /agents:
    get:
      tags: [agents]
      summary: List active agent branches. (Agent Branch API, :8088)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { agents: { type: array, items: { $ref: "#/components/schemas/AgentBranch" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agents/{id}/branch:
    post:
      tags: [agents]
      summary: Create an agent's branch and return its DSN. (Agent Branch API, :8088)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: false
        description: >-
          Optional Blackbox provenance. Without it the request and response are unchanged. With it,
          a session is recorded on the agent's branch and every change the agent makes there carries
          the session, task and parent session; the response adds session_id (and the ids sent).
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string, maxLength: 200 }
                parent_session_id: { type: string, maxLength: 200 }
                session_id: { type: string, maxLength: 200, description: "Your own session id (default: generated)" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentBranch" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [agents]
      summary: Delete an agent's branch. (Agent Branch API, :8088)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Deleted }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /healthz:
    get:
      tags: [status]
      security: []
      summary: Liveness (public). (Agent Branch API, :8088)
      responses: { "200": { description: OK } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key (`key_…`) minted with `fox apikey create`.
  parameters:
    BranchName:
      name: name
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid API key.
  schemas:
    PolicyRule:
      type: object
      required: [rule_id, command_tag, reason]
      properties:
        rule_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        command_tag: { type: string, example: ALTER TABLE }
        pattern: { type: [string, "null"], description: Case-insensitive PostgreSQL regular expression over the statement }
        action: { type: string, enum: [warn, block], default: warn }
        reason: { type: string }
        hint: { type: [string, "null"] }
        enabled: { type: boolean }
        builtin: { type: boolean, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        updated_by: { type: [string, "null"], readOnly: true }
    PolicyDetail:
      type: object
      description: The DETAIL JSON of a BBX01/BBX02 policy error or warning (docs/policy-errors.md, contract v1).
      properties:
        v: { type: integer }
        rule_id: { type: string }
        action: { type: string, enum: [warn, block] }
        command: { type: string }
        matched: { type: [string, "null"] }
        reason: { type: string }
        hint: { type: string }
        override: { type: [string, "null"] }
        evaluation_id: { type: [integer, "null"] }
        blackbox_id: { type: [integer, "null"] }
        impact: { type: [object, "null"] }
    Branch:
      type: object
      properties:
        name: { type: string }
        state: { type: string }
        primary: { type: boolean }
        agent: { type: boolean }
        used: { type: string }
        connections: { type: integer }
    AgentBranch:
      type: object
      properties:
        agent: { type: string }
        branch: { type: string }
        host: { type: string, description: "The Gateway's host: an agent connects through it, not to the branch's container." }
        port: { type: string, description: "The Gateway's port (6432 by default)." }
        dsn:
          type: string
          description: >-
            Connection string for this branch, routed through the Gateway, so it
            is reachable from the host and not only from inside the VM. The
            password is an API key scoped to this one branch: it opens no other
            branch, and the control plane and this API both refuse it. Returned
            once, at creation — listings omit the key — and revoked when the
            branch is deleted.
        status: { type: string, description: "ready, or suspended when the branch's container is stopped (the Gateway wakes it on connect)." }
    Backup:
      type: object
      properties:
        name: { type: string, description: "The wal-g base backup name, e.g. base_00000001000000000000001A." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, description: A restore can start from this backup for any target at or after this time. }
        size_bytes: { type: integer, description: Compressed size as stored. }
        newest: { type: boolean, description: True for the most recent backup (the one a "latest" restore starts from). }
    Replication:
      type: object
      properties:
        branch: { type: string }
        replicating: { type: boolean }
        tables: { type: integer, description: Tables the subscription covers. }
        tables_ready: { type: integer, description: "Tables whose initial copy is done and that now stream changes. Cut over once it equals tables." }
        last_message_at: { type: string, format: date-time, description: When the source last sent anything. }
        received_lsn: { type: string }
    QueryResult:
      type: object
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array } }
        error: { type: string }
